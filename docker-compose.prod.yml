# Production stack for a homelab behind a Cloudflare Tunnel.
#
#   just prod-up      # docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Nothing is published to the LAN or the internet. cloudflared dials out, and
# the only bound ports are loopback, for debugging. The backend stays unpublished
# on purpose: its sole identity source is the `Cf-Access-Jwt-Assertion` header
# the tunnel's edge injects, so a reachable backend is a reachable impersonation
# primitive.
name: codeforces-gym-prod

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: codeforces_gym_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "codeforces_gym_db"]
      interval: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?}@db:5432/codeforces_gym_db
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.prod}
      # ENV=production makes config.py refuse to start if AUTH_DISABLED is set
      # anywhere, and AUTH_DISABLED is deliberately absent from this file.
      ENV: production
      CF_TEAM_DOMAIN: ${CF_TEAM_DOMAIN:?set CF_TEAM_DOMAIN in .env.prod}
      CF_AUD: ${CF_AUD:?set CF_AUD in .env.prod}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Debugging only — cloudflared reaches nginx over the compose network.
      # `/api` still needs a real Access token, so this is not a way in.
      - "127.0.0.1:8080:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Reads TUNNEL_TOKEN from the environment.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env.prod}
    depends_on:
      frontend:
        condition: service_started

volumes:
  postgres_data:
