# Serves the built SPA, and the API under the same origin.
#
# Same origin is what makes the client work in production: src/lib/api.ts
# fetches relative `/api/...` paths, and in development that is the Vite proxy.
# Here nginx is the proxy instead, and because Cloudflare Access injects its JWT
# header on the request, nginx must forward request headers untouched — the
# backend's only identity source is `Cf-Access-Jwt-Assertion`.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The SPA owns routing (ssr = false, adapter-static fallback): any path the
    # build did not emit is the app shell, not a 404.
    location / {
        try_files $uri /index.html;
    }

    # The shell itself must never be cached, or a deploy goes unnoticed.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite fingerprints every file under here, so it is safe to pin for a year.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A catalog or submission sync paces Codeforces at 2 s per call and can
        # page twenty times, so these are minutes of wall clock, not seconds.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
